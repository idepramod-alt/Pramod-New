name: Build Pramod Octapad Loop MIDI APK

on:
  push:
    branches: [ main ]
    paths:
      - 'gradle_build/**'
      - '.github/workflows/build.loopmidi.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APKs (Full / Loops / Drums)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Gradle wrapper in app project
        working-directory: gradle_build
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew

      - name: Build Android APKs
        working-directory: gradle_build
        run: |
          set -o pipefail
          ./gradlew assembleFullDebug assembleLoopsDebug assembleDrumsDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee /tmp/build_loopmidi.log

      - name: Show build log on failure
        if: failure()
        run: tail -n 400 /tmp/build_loopmidi.log || true

      - name: Prepare APK artifacts
        if: success()
        run: |
          mkdir -p artifacts
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          cp "gradle_build/app/build/outputs/apk/full/debug/app-full-debug.apk" "artifacts/PramodOctapad-Full-v1.0-debug-${SHORT}.apk"
          cp "gradle_build/app/build/outputs/apk/loops/debug/app-loops-debug.apk" "artifacts/PramodOctapad-Loops-v1.0-debug-${SHORT}.apk"
          cp "gradle_build/app/build/outputs/apk/drums/debug/app-drums-debug.apk" "artifacts/PramodOctapad-Drums-v1.0-debug-${SHORT}.apk"
          ls -lh artifacts/

      - name: Upload Full APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PramodOctapad-Full-Debug-APK
          path: artifacts/PramodOctapad-Full-v1.0-debug-*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Loops APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PramodOctapad-Loops-Debug-APK
          path: artifacts/PramodOctapad-Loops-v1.0-debug-*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Drums APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PramodOctapad-Drums-Debug-APK
          path: artifacts/PramodOctapad-Drums-v1.0-debug-*.apk
          retention-days: 30
          if-no-files-found: error
