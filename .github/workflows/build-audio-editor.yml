name: Build Audio Editor APK

on:
  push:
    branches: [main]
    paths:
      - 'audio-editor/**'
      - '.github/workflows/build-audio-editor.yml'
  pull_request:
    paths:
      - 'audio-editor/**'
      - '.github/workflows/build-audio-editor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Audio Editor APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle wrapper
        working-directory: audio-editor
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew

      - name: Build APK
        working-directory: audio-editor
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Prepare artifact
        if: success()
        run: |
          mkdir -p artifacts
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          cp "audio-editor/app/build/outputs/apk/debug/app-debug.apk" "artifacts/AudioEditor-v1.0-debug-${SHORT}.apk"
          ls -lh artifacts/

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: audio-editor-apk
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error
