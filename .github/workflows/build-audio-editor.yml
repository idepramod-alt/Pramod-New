name: Build Audio Editor APK

on:
  push:
    branches: [main]
    paths:
      - 'audio-editor/**'
      - '.github/workflows/build-audio-editor.yml'
  pull_request:
    paths:
      - 'audio-editor/**'
      - '.github/workflows/build-audio-editor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Audio Editor APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: audio-editor
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Check APK exists
        run: |
          ls -la audio-editor/app/build/outputs/apk/debug/ || echo "APK directory not found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AudioEditor-v1.0-debug
          path: audio-editor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
